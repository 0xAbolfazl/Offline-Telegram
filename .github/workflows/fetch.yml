name: Fetch Telegram Messages

on:
  workflow_dispatch:
  # schedule:                     # در صورت نیاز، کامنت زیر را فعال کنید
  #   - cron: '0 */12 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install -r requirements.txt

      - name: Fetch and encrypt messages
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PHONE: ${{ secrets.PHONE }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python fetch_messages.py

      - name: Commit and push encrypted database to main branch
        run: |
          # Create dbs folder if not exists
          mkdir -p dbs

          # Move encrypted file to dbs folder
          if [ -f messages.db.encrypted ]; then
            mv messages.db.encrypted dbs/
            echo "Moved messages.db.encrypted to dbs/"
          else
            echo "ERROR: messages.db.encrypted not found!"
            exit 1
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add and commit
          git add dbs/messages.db.encrypted
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update encrypted database - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
            echo "Successfully pushed encrypted database to main branch"
          fi