name: Fetch Telegram Messages

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 */12 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install -r requirements.txt

      - name: Fetch and encrypt messages
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PHONE: ${{ secrets.PHONE }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}     
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python fetch_messages.py

      - name: Commit and push encrypted database
        run: |
          mkdir -p dbs
          if [ -f messages.db.encrypted ]; then
            mv messages.db.encrypted dbs/
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dbs/messages.db.encrypted
            git diff --cached --quiet || git commit -m "Update encrypted database - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
          else
            echo "No encrypted file to commit"
            exit 1
          fi