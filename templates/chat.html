<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Messages - Chat {{ chat_id }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <a href="/" class="back">← Back to list</a>
        <div class="messages">
            {% for sender, date, text in messages %}
            <div class="message">
                <div class="sender">{{ sender }}</div>
                <div class="text">{{ text | safe }}</div>
                <div class="date">{{ date[:19] }}</div>
            </div>
            {% else %}
            <div class="empty">No messages found.</div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
