<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Telegram Archive</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Saved Chats</h1>
        <ul class="chat-list">
            {% for chat_id, title in chats %}
            <li><a href="/chat/{{ chat_id }}">{{ title }}</a></li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
